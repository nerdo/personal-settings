# ~/.local/bin first for user services started before any desktop login (Orca's server lingers). A desktop login
# replaces this PATH with uwsm's, which ../../uwsm/env.d/50-local-bin-first orders the same way.
# Linked to ~/.config/environment.d/ by zsh/bin/link-local-bin. Read when the user's systemd starts.
PATH=$HOME/.local/bin:${PATH}
