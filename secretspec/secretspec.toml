# Dannel's keys, loaded per command (aliases.zsh beside this file). Names and OpenBao paths only, never values.
# Store: OpenBao kv/dannel/<group>/<item> on scrts.strflt.com, logged in as dannel with the AppRole login SecretSpec
# reads from the Keychain items strflt-openbao-dannel/role_id and /secret_id (another machine: its own secret, same
# item names; see strflt-system-administration machines/joker/openbao/dannel/). Cache: the keyring, 1 day; while an
# entry is fresh OpenBao is not asked (`secretspec -f <this file> cache clear` after a rotation).
# Each profile is one command's set: a program sees only its profile's names.
[project]
name = "dannel-shell"
revision = "1.0"

[providers]
bao = { uri = "openbao://scrts.strflt.com/kv?auth=approle", credentials = { role_id = { provider = "keyring", ref = { item = "strflt-openbao-dannel", field = "role_id" } }, secret_id = { provider = "keyring", ref = { item = "strflt-openbao-dannel", field = "secret_id" } } } }
cache = "keyring://dannel-shell-cache/{project}/{profile}/{key}"
dannel = { fallback = ["bao"], cache = { provider = "cache", max_age = "1d" } }

[defaults]
providers = ["dannel"]


[profiles.harness]
CONTEXT7_API_KEY = { description = "Context7 MCP", refs = { bao = { item = "dannel/context7", field = "CONTEXT7_API_KEY" } } }
LANGFUSE_BASE_URL = { description = "Langfuse tracing", refs = { bao = { item = "dannel/langfuse", field = "LANGFUSE_BASE_URL" } } }
LANGFUSE_HOST = { description = "Langfuse tracing (older name)", refs = { bao = { item = "dannel/langfuse", field = "LANGFUSE_BASE_URL" } } }
LANGFUSE_PUBLIC_KEY = { description = "Langfuse tracing", refs = { bao = { item = "dannel/langfuse", field = "LANGFUSE_PUBLIC_KEY" } } }
LANGFUSE_SECRET_KEY = { description = "Langfuse tracing", refs = { bao = { item = "dannel/langfuse", field = "LANGFUSE_SECRET_KEY" } } }
GITHUB_TOKEN = { description = "~/.npmrc (GitHub packages)", refs = { bao = { item = "dannel/github", field = "GITHUB_PERSONAL_ACCESS_TOKEN" } } }
