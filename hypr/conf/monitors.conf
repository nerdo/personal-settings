# hyprlang mirror of lua/monitors.lua. NOT LOADED — the active config is
# hyprland.lua, which does require("monitors") -> ~/.config/hypr/monitors.lua.
# This file exists only because nwg-displays writes hyprlang and overwrites it
# on save. Keep it in sync so a stale copy never becomes the source of truth.
#
# Layout must stay normalized to the origin (no negative x/y) or nwg-displays
# clips the offscreen monitor out of its canvas. See lua/monitors.lua for why.

monitor=HDMI-A-1,disable
# DP-2 = XHS XR32UMH 4K, rotated 90deg (portrait), anchored at the origin.
monitor=DP-2,3840x2160@120.00,0x0,1.0
monitor=DP-2,transform,1
# DP-3 = ASUS PG32UCDP 240Hz, primary, right of and bottom-aligned with DP-2.
monitor=DP-3,3840x2160@240.02,2160x1680,1.0
